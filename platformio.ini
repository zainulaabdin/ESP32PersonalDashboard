; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = app

[env]
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; DTR must stay asserted for the native USB-Serial/JTAG console driver to
; actually flush output to the host - with it forced inactive, everything
; after the ROM's own raw boot text (which ignores DTR) is silently dropped.
monitor_dtr = 1
monitor_rts = 0

; This board's chip has embedded Octal PSRAM (esptool reports "Embedded PSRAM
; 8MB"; the vendor's own Arduino IDE guide confirms "OPI PSRAM"), but the
; esp32-s3-devkitc-1 board definition assumes no PSRAM at all. This is the
; objectively correct config for this hardware even though it turned out NOT
; to be the cause of the "silent boot" scare - see CLAUDE.md.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; lib/lvgl's own sources (e.g. font files) don't automatically get the
    ; project's include/ dir the way src/ files do, so lv_conf_internal.h's
    ; auto-detect can't find our lv_conf.h there and silently falls back to
    ; conservative defaults (e.g. only the default font size compiled in) -
    ; force the path explicitly so LV_CONF_INCLUDE_SIMPLE actually works
    ; project-wide, not just for src/ files.
    -Iinclude

lib_deps =
    adafruit/Adafruit NeoPixel

[env:app]
build_src_filter = -<*> +<app/>
; Espressif's stock 16MB OTA layout: two 6.25MB app slots (app0/app1, so an
; OTA update can be written to the idle slot) + 3.4MB SPIFFS. The board
; profile's own default only uses the first 8MB (two 3.3MB slots), which the
; firmware has outgrown.
board_build.partitions = partitions_jarvis.csv
; lv_conf_internal.h's own auto-detect of include/lv_conf.h is unreliable
; (its comments acknowledge this), so force it explicitly.
; CORE_DEBUG_LEVEL=3 (Info): framework errors/warnings/info on Serial.
build_flags =
    ${env.build_flags}
    -D LV_CONF_INCLUDE_SIMPLE
    -D CORE_DEBUG_LEVEL=3
    ; ESP-SR WakeNet ("Jarvis" wake word) - prebuilt libs in lib/esp_sr/libs
    -Llib/esp_sr/libs
    -lwakenet
    -ldl_lib
    -lhufzip
    -lc_speech_features
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.4.1

; Published firmware (GitHub releases / OTA): built from the empty
; secrets.h.example, so firmware.bin never contains keys.
[env:release]
extends = env:app
build_flags =
    ${env:app.build_flags}
    -D RELEASE_BUILD
